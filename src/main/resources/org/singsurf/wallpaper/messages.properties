Rule.attractive=attractive
Rule.C.descript=Cyclic groups describe rotation by 2 pi/n around a single point.\n\
	It's group is the same as the integers mod n under addition.\n\
	Orbifold notation: n\u2022, the \u2022 indicates the operation fixes a point.
Rule.c.prefix=c
Rule.C.prefix=C
Rule.D.descript=The dihedral group of order n has a rotations of 2pi/n and n axis of reflection.\n\
	It is the symmetry group of and n sided regular polygon.\n\
	Orbifold notation: *n\u2022
Rule.d.prefix=d
Rule.D.prefix=D
Rule.D1.descript=The first dihedral group D1 is just a reflection in a line
Rule.F1=F1
Rule.F1.descript=The simplest frieze group with a single translation in one direction.
Rule.F2=F2
Rule.F2.descript=A glide reflection: translate in one direction then reflect.
Rule.F3=F3
Rule.F3.descript=This has one line of reflection and a translation along that line.
Rule.F4=F4
Rule.F4.descript=This group has two reflections in parallel lines and a translation in a perpendicular direction.
Rule.F5=F5
Rule.F5.descript=Two 180 degree rotations and a translation.
Rule.F6=F6
Rule.F6.descript=Two rotations, two reflections, a glide reflection and a translation.
Rule.F7=F7
Rule.F7.descript=Two reflections in parallel lines and one reflection in a perpendicular line.\nIt also has a translation and two 180 degree rotations where the lines of reflections meet.\n

Rule.Msg.illegal_sel_point=Illegal selection point
Rule.Msg.Only_red_or_green=Only green or red points can be selected

Rule.CM=CM
Rule.CM.descript=A reflection and a parallel glide reflection \
	with a rhombic lattice. \
	One edge of the fundamental domain is fixed by \
	the reflection line, here we have an isosceles triangle.\n\
	Orbifold notation: *x, underlying manifold: Möbius band, chromatic number: 6 
Rule.CMM=CMM
Rule.CMM.descript=Two reflections along the diagonals of a rhombus.\n\
	The pattern includes one cyclic C2 rotation and two dihedral D2 rotations, \
	It also has two glide-reflection.\n\
	Two of the edges of the fundamental domain are the mirrors, the other is \
	is flexible, here we have a straight line.\n\
	Orbifold notation: 2*22, underlying manifold: disk, chromatic number: 4 

Rule.CMr=CMr
Rule.CMr.descript=Alternate version of CM with a rectangular fundamental domain.
Rule.CMMr=CMMr
Rule.CMMr.descript=Alternate version of CMM with a rectangular fundamental domain.



Rule.P1=P1
Rule.P1.descript=The simplest group just consisting of two linearly independent translations,\
	with no restrictions on their directions.\
	Fundamental domain can take any shape, here we choose a parallelogram.\
	This is the most common pattern found in wrapping paper\
	where the same motif is repeated across the image.\n\
	Orbifold notation: o, underlying manifold: torus, chromatic number: 7 
Rule.P1a=P1A
Rule.P1h=P1H
Rule.P1h.descript=A variant on the p1 pattern when the basic tile is an irregular hexagon.
Rule.P2=P2
Rule.P2.descript=Four 180º rotations.\
	No restrictions on directions of translations.\
	Fundamental domain can take any shape, here we choose a triangle.\n\
	Orbifold notation: 2222, underlying manifold: sphere, chromatic number: 4
Rule.P2a=P2A
Rule.P2h=P2H
Rule.P2h.descript=A variant on the p2 pattern when the basic tile is an irregular hexagon.\n\
	The fundamental domain is a trapezium made by cutting the tile in half.
Rule.P3=P3
Rule.P3.descript=Three 120º rotations.\
	Translations must be at 60º\n\
	Fundamental domain can take any shape, here we choose a parallogram.\n\
	Orbifold notation: 333, underlying manifold: sphere, chromatic number: 4	
Rule.P3h=P3h
Rule.P3h.descript=Alternate version of P3 with hexagonal fundamental domain.

Rule.P31M=P31M
Rule.P31M.descript=One reflection line, one dihedral 120º rotations and one cyclic 120º rotation.\
	Translations must be at 60º.\
	There are various possible shapes for the fundamental domain, here we have a thin isosceles triangle.\n\
	Orbifold notation: 3*3, underlying manifold: disk, chromatic number: 4
Rule.P31Mk=P31Mk
Rule.P31Mk.descript=Alternate version of p31m with a kite-shaped fundamental domain.

Rule.P31Mt=P31Mt
Rule.P31Mt.descript=Alternate version of p31m with a trapesium-shaped fundamental domain.

Rule.P3M1=P3M1
Rule.P3M1.descript=Three dihedral 120º rotations and three reflection through the rotation points.\
	Translations at 60º. Fundamental domain is an equilateral triangle.\n\
	Orbifold notation: *333, underlying manifold: disk, chromatic number: 4
Rule.P4=P4
Rule.P4.descript=Two 90º rotations and one 180º rotation.\
	Fundamental domain is a square, translations at right angles.\n\
	Orbifold notation: 442, underlying manifold: sphere, chromatic number: 4	
Rule.P4G=P4G
Rule.P4G.descript=One 90º rotation and a glide-reflection. \
    There is only one lines of reflection which does not pass through \
	the 90º rotation points. \
	The fundamental domain is a right angled isosceles triangle, with \
	a square lattice.\n\
	Orbifold notation: 4*2, underlying manifold: disk, chromatic number: 4		
Rule.P4M=P4M
Rule.P4M.descript=A 90º rotation and a reflection passing through the \
	centre of rotation.\n\
	Shows the full symmetry of the square with \
	three reflections and a 180º rotation.\n\
	Orbifold notation: *442, underlying manifold: disk, chromatic number: 4
Rule.P6=P6
Rule.P6.descript=A 60º rotation an a 120º rotation and a 180º rotation.\n\
    Fundamental domain an equilateral triangle, translations at 60º.\n\
    Orbifold notation: 632, underlying manifold: sphere, chromatic number: 4
Rule.P6M=P6M
Rule.P6M.descript=60º, 120º and 180º dihedral rotations and a reflection.\n\
    The fundamental domain is half an equilateral triangle, translations at 60º.\n\
    Orbifold notation: *632, underlying manifold: disk, chromatic number: 4
Rule.PG=PG
Rule.PG.descript=A Glide-reflection.\n\
	This transformation is performed by first translating the domain \
	and then reflecting it around the vector of the translation. \
	Rectangular lattice. The shape of the fundamental domain is flexible, \
	here we use a rectangle.\n\
	Orbifold notation: xx, underlying manifold: Klein bottle, chromatic number: 6	
	
Rule.PGG=PGG
Rule.PGG.descript=Two glide reflections at right angles.\n\
	This pattern also shows two a 180º rotations. \
	Rectangular lattice. \n\
	Orbifold notation: 22x, underlying manifold: RP²Klein bottle, chromatic number: 6	

Rule.PM=PM
Rule.PM.descript=Generated by two parallel reflections and a translation.\n\
	Rectangular fundamental domain and lattice.\n\
	Orbifold notation: **, underlying manifold: cylinder, chromatic number: 4
Rule.PMG=PMG
Rule.PMG.descript=A Glide reflection and a reflection. This pattern also shows a 180º rotation.\n\
    The fundamental domain is a rectangle, the lattice is rectangular.\n\
    Orbifold notation: 22*, underlying manifold: disk, chromatic number: 4
Rule.PMM=PMM
Rule.PMM.descript=Two reflections at right angles, this pattern has a 180º rotation.\n\
    The fundamental domain is rectangular with a rectangular lattice.\n\
    Orbifold notation: *2222, underlying manifold: disk, chromatic number: 4

# Basic non-repeating transformations
Rule.reflection=Reflection
Rule.reflection.descript=A reflection of the image.\nReflects along the line through the green point and red point
Rule.rotation=Rotation
Rule.rotation.descript=A rotation of the image.\nRotates around the green point
Rule.scale=Scale
Rule.scalexy=Scale XY
Rule.scalexy.descript=Scaling in XY direction
Rule.symmetrical=symmetrical
Rule.trans=Translation
Rule.trans.descript=A Translation of the image.\nTranslates green point to red point
Rule.uniformscale=Scale
Rule.uniformscale.descript=A uniform scaling
Rule.glide=Glide-Reflection
Rule.glide.descript=First the image is translated along a line and then reflected along the line.\nThe length of the line specifies the length of the translation.
Rule.identity=Identity
Rule.identity.descript=Identity.\nWill tile the output
Rule.linear=Linear
Rule.linear.descript=General linear map\nSpecified by two vectors

