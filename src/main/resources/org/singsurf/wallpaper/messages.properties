Info.constrain= Constrain Vertices: constrains the vertices of a pattern so \
	that it is suitable for use as a tiled desktop/webpage background image.\n\
	Vertices are alligned on vertical/horizontal axis.\n\
	The tilable region is outline in green,	use File->Save Tile to save this region.
Info.Intro=This applet calculate a symmetry pattern based on one of 17 different patterns. \
	Click and drag the Red, Green or Blue points to move the yellow polygon. \
	Select a button on left to change the type. The blue polygon gives the 'Fundamental Domain'.\n\
	The patten is created by taking this region and reflecting, rotating and translating it. \
    The yellow polygon gives the region which is repeated by translation only. \
    Double click to redraw and right click to revert back to original image.
IntroBox1a=Click and drag the red, green or blue dots
IntroBox1b=to change the pattern.
IntroBox2a=Click a button on the left
IntroBox2b=to change the type of pattern.
