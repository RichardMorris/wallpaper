Intro1=This applet calculate a symmetry pattern based on one of 17 different patterns.\n
Intro2=Click and drag the Red, Green or Blue points to move the yellow polygon.\n
Intro3=Select a button on left to change the type.\n
Intro4=The blue polygon gives the 'Fundamental Domain'. The patten is created by\n
Intro5=taking this region and reflecting, rotating and translating it.\n
Intro6=The yellow polygon gives the region which is repeated by translation only.\n
Intro7=Double click to redraw and right click to revert back to original image.
IntroBox1a=Click and drag the red, green or blue dots
IntroBox1b=to change the pattern.
IntroBox2a=Click a button on the left
IntroBox2b=to change the type of pattern.
