Rule.attractive=attractive
Rule.C.descript=Cyclic groups describe rotation by 2 pi/n around a single point.\nIt is equivalent to the group of integers mod n under addition.
Rule.c.prefix=c
Rule.C.prefix=C
Rule.CM=CM
Rule.CM.descript=A reflection through opposite corners of diamond.\nThe lengths of each side of the diamond are all equal\nOnly one side of the fundamental domain needs to be a straight line
Rule.CMM=CMM
Rule.CMM.descript=Two reflections through opposite corners of diamond.\nThe reflections must be at right angles and form two of the sides of the fundamental domain.\nThe other side does not needs to be a straight line.
Rule.D.descript=The dihedral group of order n has a rotations of 2pi/n and n axis of reflection.\nIt is the symmetry group of and n sided regular polygon.
Rule.d.prefix=d
Rule.D.prefix=D
Rule.D2.descript=The first dihedral group D2 is just a reflection in a line
Rule.F1=F1
Rule.F1.descript=The simplest frieze group with a single translation in one direction.
Rule.F2=F2
Rule.F2.descript=A glide reflection: translate in one direction then reflect.
Rule.F3=F3
Rule.F3.descript=This has one line of reflection and a translation along that line.
Rule.F4=F4
Rule.F4.descript=This group has two reflections in parallel lines and a translation in a perpendicular direction.
Rule.F5=F5
Rule.F5.descript=Two 180 degree rotations and a translation.
Rule.F6=F6
Rule.F6.descript=Two rotations, two reflections, a glide reflection and a translation.
Rule.F7=F7
Rule.F7.descript=Two reflections in parallel lines and one reflection in a perpendicular line.\nIt also has a translation and two 180 degree rotations where the lines of reflections meet.\n

Rule.glide=Glide-Reflection
Rule.glide.descript=First the image is translated along a line and then reflected along the line.\nThe length of the line specifies the length of the translation.
Rule.identity=Identity
Rule.identity.descript=Identity.\nWill tile the output
Rule.linear=Linear
Rule.linear.descript=General linear map\nSpecified by two vectors
Rule.Msg.illegal_sel_point=Illegal seletion point
Rule.Msg.Only_red_or_green=Only green or red points can be selected

Rule.P1=P1
Rule.P1.descript=The simplest possible pattern just consisting of two translations.\nThe translations can be at any angle.\nAll other patterns also have two translation symmetries\nas you can observe by examining the yellow polygon.\nThe rest of the pattern can always be generated by translating\nthe area inside this polygon.\n\nThis is actually the most common pattern found in wrapping paper\nwhere the same motif is repeated across the image.\n\nThe boundary of the fundamental domain does not have to be\nstraight lines.
Rule.P1a=P1A
Rule.P1h=P1H
Rule.P1h.descript=A varient on the p1 pattern when the basic tile is an irregular hexagon.\n
Rule.P2=P2
Rule.P2.descript=The next simplest pattern with just one 180º rotation.\nThis is the only other pattern where the two translations have\nfull freedom of movement.
Rule.P2a=P2A
Rule.P2h=P2H
Rule.P2h.descript=A varient on the p2 pattern when the basic tile is an irregular hexagon.\nThe fundamental domain is a trapesium made by cutting the tile in half.
Rule.P3=P3
Rule.P3.descript=A 120º rotation alternate domain
Rule.P31M=P31M
Rule.P31M.descript=A 120º rotation and a reflection through mid points of edge of hexagon.
Rule.P31Mk=P31Mk
Rule.P31Mk.descript=P31Mk P331M with a kite-shaped FD.
Rule.P3A=P3A
Rule.P3A.descript=A 120º rotation
Rule.P3M1=P3M1
Rule.P3M1.descript=A 120º rotation and a reflection through corner of hexagon.
Rule.P4=P4
Rule.P4.descript=A 90º rotation.\nA square has much more symmetry than a rectangle or diamond.\nAs well as the two  90º rotation there is an 180º rotation.\nand two lines of reflection.
Rule.P4G=P4G
Rule.P4G.descript=A 90º rotation and a glide-reflection.\nThere is only one lines of reflection which does not pass through\nthe 90º rotation points.\nOne of my favorite patterns with the rotation appearing\nto go in opposite directions.\nThe fundamental domain is a right angled isosceles triangle.
Rule.P4M=P4M
Rule.P4M.descript=A 90º rotation and a reflection passing through the\ncenter of rotation.\nShows the full symmetry of the square with\nthree reflections and a 180º rotation.
Rule.P6=P6
Rule.P6.descript=A 60º rotation.
Rule.P6M=P6M
Rule.P6M.descript=A 60º rotation and a reflection.
Rule.PG=PG
Rule.PG.descript=A Glide-reflection.\nThis transformation is performed by first translating the domain\nand then reflecting it in the line of the translation.\n
Rule.PGG=PGG
Rule.PGG.descript=Two glide reflections at right angles.\nThis pattern also shows a 180º rotation. A rather unsatisfactory pattern visually
Rule.PM=PM
Rule.PM.descript=A Reflection along one of the translation directions.\nThe other translation is at right angles giving a rectangular fundamental domain.
Rule.PMG=PMG
Rule.PMG.descript=A Glide reflection and a reflection. This pattern also shows a 180º rotation.
Rule.PMM=PMM
Rule.PMM.descript=Two reflections at right anglesThis pattern also shows a 180º rotation.

Rule.reflection=Reflection
Rule.reflection.descript=A reflection of the image.\nReflects along the line through the green point and red point
Rule.rotation=Rotation
Rule.rotation.descript=A rotation of the image.\nRotates around the green point
Rule.scale=Scale
Rule.scalexy=Scale XY
Rule.scalexy.descript=Scalling in XY direction
Rule.symmetrical=symmetrical
Rule.trans=Translation
Rule.trans.descript=A Translation of the image.\nTranslates green point to red point
Rule.uniformscale=Scale
Rule.uniformscale.descript=A uniform scalling

